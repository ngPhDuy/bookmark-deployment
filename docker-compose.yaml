services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bookmark_service
      - portal
    restart: unless-stopped

  bookmark_service:
    image: ${BACKEND_IMAGE:-duyngph1/bookmark-service:latest}
    env_file:
      - ./bookmark_service/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  portal:
    image: ebvn/bookmark-app-portal:mono
    platform: linux/amd64
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
